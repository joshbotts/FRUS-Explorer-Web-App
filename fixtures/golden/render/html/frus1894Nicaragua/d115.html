<div class="frus-document"><h2 class="doc-heading">No. 115.<br><em>Mr. <a class="pers-name" href="#">Gresham</a> to Mr. <a class="pers-name" href="#">Baker</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Washington</span></span>, <em>October 25, 1894</em>.</p></div><p class="body">Nicaraguan minister has advised his Government to permit Wiltbank and Lampton to resume their residence and business in Mosquito. Urge that this be promptly done and report by cable.</p></div>
