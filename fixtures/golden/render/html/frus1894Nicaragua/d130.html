<div class="frus-document"><h2 class="doc-heading">No. 130.<br><em>Mr. <a class="pers-name" href="#">Baker</a> to Mr. <a class="pers-name" href="#">Gresham</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Legation of the United States</span>,<br><em>La Libertad</em></span>, <em>December 17, 1894</em>.</p></div><p class="body">Mosquito Indians have surrendered their rights under the treaty of 1860 and been incorporated with Nicaragua.</p></div>
