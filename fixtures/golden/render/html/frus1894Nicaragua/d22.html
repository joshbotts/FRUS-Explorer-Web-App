<div class="frus-document"><h2 class="doc-heading">No. 22.<br><em>Mr. <a class="pers-name" href="#">Gresham</a> to Mr. <a class="pers-name" href="#">Braida</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Washington</span></span>, <em>March 28, 1894</em>.</p></div><p class="body">You are not authorized to perform diplomatic functions, and will not meddle in political affairs in Mosquito. Naval vessel will soon reach Bluefields.</p></div>
