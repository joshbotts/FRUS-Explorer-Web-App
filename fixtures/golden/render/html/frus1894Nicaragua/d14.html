<div class="frus-document"><h2 class="doc-heading">No. 14.<br><em>Mr. <a class="pers-name" href="#">Gresham</a> to Mr. <a class="pers-name" href="#">Baker</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Department of State</span>,<br><em>Washington</em></span>, <em>March 14, 1894</em>.</p></div><p class="body">Did Great Britain land troops under asserted right of sovereignty or only for protection? Prompt answer desired.</p></div>
