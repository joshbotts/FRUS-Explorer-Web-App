<div class="frus-document"><h2 class="doc-heading">No. 71.<br><em>Mr. <a class="pers-name" href="#">Gresham</a> to Mr. <a class="pers-name" href="#">Baker</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Washington</span></span>, <em>July 12, 1894</em>.</p></div><p class="body">Nicaraguan minister here is advised by his Government of an insurrection in Mosquito participated in by Americans. Full and prompt report by you is desirable.</p></div>
