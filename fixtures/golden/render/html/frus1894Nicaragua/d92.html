<div class="frus-document"><h2 class="doc-heading">No. 92.<br><em>Mr. <a class="pers-name" href="#">Gresham</a> to Mr. <a class="pers-name" href="#">Baker</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Washington</span></span>, <em>August 16, 1894</em>.</p></div><p class="body">Your dispatch, 344, received. Pull advices from naval commanders show that very few American citizens were concerned in the recent movement at Bluefields, and none of good repute.</p></div>
