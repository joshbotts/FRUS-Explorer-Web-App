<div class="frus-document"><h2 class="doc-heading">No. 30.<br><em>Mr. <a class="pers-name" href="#">Baker</a> to Mr. <a class="pers-name" href="#">Gresham</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Legation of the United States</span>,<br><em>Managua</em></span>, <em>April 9, 1894</em>.</p></div><p class="body">One hundred Nicaragua troops leave here to-morrow for Bluefields to perform police duty.</p></div>
