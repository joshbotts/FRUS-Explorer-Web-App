<div class="frus-document"><h2 class="doc-heading">No. 8.<br><em>Mr. <a class="pers-name" href="#">Baker</a> to Mr. <a class="pers-name" href="#">Gresham</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Legation of the United States</span>,<br><em>Managua</em></span>, <em>March 6, 1894</em>.</p></div><p class="body">Consul Braida telegraphs fifty English soldiers landed Bluefields; strongly urged American warship.</p></div>
