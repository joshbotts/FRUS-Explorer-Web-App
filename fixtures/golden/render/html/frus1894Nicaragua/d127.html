<div class="frus-document"><h2 class="doc-heading">No. 127.<br><em>Mr. <a class="pers-name" href="#">Gresham</a> to Mr. <a class="pers-name" href="#">Bayard</a>.</em></h2><div class="letter-opener"><span class="unknown" data-element-name="seg">[Telegram.]</span></div><div class="letter-opener"><p class="dateline"><span class="unknown" data-element-name="placeName"><span class="small-caps">Washington</span></span>, <em>November 28, 1894</em>.</p></div><p class="body">Statements in newspapers of to-day about action of United States, based upon what Great Britain has done or may do at Bluefields, pure fabrication.</p></div>
