# FRUS Explorer Light CI, on every pull request and on main.
# - swift: build and test in swift:6.4-noble with libsqlite3-dev, the way scripts/swift runs them, with
#   a PostgreSQL service, so the user store's conformance suite runs on both of its stores (S14d).
# - web: the browser app in web/, typechecked, linted, unit-tested and built with Node at
#   web/.node-version, as scripts/npm runs it.
# - compose: build the image, then scripts/compose-smoke --e2e checks the browser app, the catalogue
#   and the reader, imports a synthetic export with docker compose cp, waits for /readyz to answer
#   200, checks the image's labels, and runs web/e2e, Playwright on Chromium, against it; then
#   again with the server under /frus-explorer/, through nginx and docs/INSTALL.md's recipe for a path.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every run on main completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  swift:
    name: swift
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    # Under amd64 emulation with 4 CPUs, a build with no cache took 12 minutes and FTS5StoreTests
    # alone 5, so the job has the compose job's headroom.
    timeout-minutes: 45
    # The PostgreSQL store's half of the user store's conformance suite runs against this database,
    # which the job's container reaches by the service's name; the Test step names it in
    # FRUS_TEST_POSTGRES_URL. Without it, the suite runs on app.db alone and the PostgreSQL store's own
    # tests are skipped, which the Test step's count of skips refuses.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: frus
          POSTGRES_PASSWORD: frus-light-tests
          POSTGRES_DB: frus
        options: >-
          --health-cmd "pg_isready -U frus -d frus"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-dev

      # The submodule is public, and checked out whole: a SourceNoteKit test reads an app resource,
      # and FRUSCoreKitTests reads the app's data files and manifest in FRUSExplorer/Resources.
      - uses: actions/checkout@v5
        with:
          submodules: true

      # The dependencies (Hummingbird, SwiftNIO and about 20 more) dominate a clean build.
      - name: Cache the SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build/linux
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      # The cache comes from an earlier build, and an incremental build over it can keep a stale
      # object. In S9b, Swift 6.4's cross-module incremental build recompiled no file of
      # FRUSParityTests after FRUSLightAPI's Volume gained stored properties, and the test crashed
      # copying a Volume with the old layout. So this package's own targets, the kits compiled from
      # the submodule among them, build clean; the dependencies, which change only with
      # Package.resolved and so with the cache's key, stay cached.
      - name: Build this package's own targets clean
        run: rm -rf .build/linux/out/Intermediates.noindex/FRUSLight.build

      # Test.cancel is Swift Testing's runtime skip, and the Test step cannot always see it: a
      # cancelled case of a parameterized test leaves no line in the log, and its test is reported as
      # passed. So no target this package builds may call it. A Linux-only skip uses a trait,
      # .disabled or .enabled(if:), whose skip the Test step sees.
      - name: No runtime skips
        run: |
          set --
          for d in $(swift package dump-package --scratch-path .build/linux | grep -o '"path" *: *"[^"]*"' | cut -d'"' -f4); do
            if [ -d "$d" ]; then set -- "$@" "$d"; fi
          done
          if [ $# -eq 0 ]; then
            echo "::error::swift package dump-package gave no target directory to search."
            exit 1
          fi
          rc=0
          grep -rnw --include='*.swift' 'Test\.cancel' "$@" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::A target calls Test.cancel, a skip the log cannot always show. SPEC's check 1 allows a Linux-only skip only if it is named: use a .disabled or .enabled(if:) trait, and name it in the Test step."
            exit 1
          fi
          [ "$rc" -eq 1 ] || exit "$rc"
          echo "No target calls Test.cancel ($# directories searched)."

      - name: Build
        run: swift build --build-tests --scratch-path .build/linux

      # Every test at the pin must run, and a skip fails the job. SPEC's check 1 allows a Linux-only
      # skip only if it is named, and there is one, allowed here by its suite and function:
      # FTS5StoreTests' backup-exclusion test, which upstream disables where Darwin is missing, with a
      # reason that begins "Linux: ". Swift Testing's skips are counted in the results it writes to a
      # file of its own (--xunit-output), where each is a <skipped> element under its test's suite and
      # function, a disabled suite's once for each of its tests. The log can lose lines: on 13 October
      # a run on main lost about 240, the named skip's among them, while every test passed. So the
      # named skip must be the file's only one: any other fails the job, and so does this test skipped
      # for another reason, or run. The log is still read for what the file cannot show: XCTest's
      # skips ("Test Case '…' skipped ("), for which no file is written here, and a test or suite that
      # cancels itself, which the file records as passed. A lost line can hide one of those, but never
      # fails the job. They are matched by the verb right after the test's or suite's name, quoted
      # (greedily, so a name holding quotes still matches) or bare: upstream has a passing test named
      # "A Lot File(s) prefix is skipped, never captured into the key", whose lines a looser pattern
      # took for a skip. grep -a reads the log and the file as text even if a test prints a NUL byte.
      - name: Test
        env:
          FRUS_TEST_POSTGRES_URL: postgres://frus:frus-light-tests@postgres:5432/frus?sslmode=disable
        run: |
          swift test --skip-build --scratch-path .build/linux --xunit-output test-results.xml 2>&1 | tee test.log
          results=test-results-swift-testing.xml
          if [ ! -s "$results" ]; then
            echo "::error::swift test wrote no Swift Testing results to $results, so this step cannot count the skips."
            exit 1
          fi
          named='<testcase classname="FTS5StoreTests.FTS5StoreTests" name="backupExclusion()">'
          skipped=$(grep -ac '<skipped' "$results" || true)
          allowed=$(grep -aA1 -F -e "$named" "$results" | grep -ac '^ *<skipped>Linux: ' || true)
          if [ "$skipped" -ne 1 ] || [ "$allowed" -ne 1 ]; then
            echo "::error::Skips in Swift Testing's results: $skipped; of them, the Linux-only skip SPEC's check 1 names: $allowed. Every test at the pin must run but that one, skipped with a reason that begins \"Linux: \"."
            grep -aB1 '<skipped' "$results" || true
            exit 1
          fi
          logged='Test "Database file has isExcludedFromBackupKey set after creation" skipped: "Linux: '
          skips='(Test|Suite) (".*"|[^ "]+) (skipped([.:]|$)|was cancelled)|Test Case .* skipped \('
          if grep -aE "$skips" test.log | grep -avF -e "$logged"; then
            echo "::error::A test was skipped or cancelled. Every test at the pin must run, except the Linux-only skip SPEC's check 1 names."
            exit 1
          fi
          echo "Named Linux-only skips (SPEC, check 1): $allowed"

      - name: Test count per target
        run: swift test list --skip-build --scratch-path .build/linux | cut -d. -f1 | sort | uniq -c

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # scripts/npm runs npm natively when Node at web/.node-version's major is on PATH.
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: scripts/npm ci

      - name: Typecheck
        run: scripts/npm run typecheck

      - name: Lint
        run: scripts/npm run lint

      - name: Unit tests
        run: scripts/npm test

      - name: Build
        run: scripts/npm run build

      # The image builds the app with its own Node, which must be the one tested here.
      - name: The image's Node is web/.node-version's
        run: |
          want="ARG NODE_IMAGE=node:$(tr -d '[:space:]' < web/.node-version)-bookworm-slim"
          if ! grep -qxF -e "$want" docker/Dockerfile; then
            echo "::error file=docker/Dockerfile::docker/Dockerfile must say '$want', to build the app with the Node web/.node-version names."
            exit 1
          fi
          echo "$want"

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v4

      # The labels' values, as image.yml builds with them; the smoke test checks them.
      - name: Build arguments
        id: args
        run: |
          args=$(scripts/release build-args)
          echo "$args"
          { echo 'list<<EOF'; echo "$args"; echo EOF; } >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: ${{ steps.args.outputs.list }}
          tags: frus-light:ci
          load: true
          # Shared with image.yml's amd64 build.
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max,ignore-error=true

      - name: Install sqlite3 for the synthetic export
        run: command -v sqlite3 || (sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3)

      # The browser suite runs from web/ in mcr.microsoft.com/playwright at the version the
      # lockfile holds, inside the server's network namespace.
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the browser suite
        run: scripts/npm ci

      - name: Pull the Playwright image
        run: docker pull "$(scripts/npm --playwright-image)"

      # scripts/check-stripped-export, which the smoke test runs on the index it installs from an
      # export with the owner's writing (PLAN's S16e), searches with GNU grep in this image.
      - name: Pull the image check 5's search runs in
        run: docker pull swift:6.4-noble

      - name: Compose smoke test and the browser suite
        run: FRUS_IMAGE=frus-light:ci scripts/compose-smoke --e2e

      - name: Upload the browser suite's report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore
