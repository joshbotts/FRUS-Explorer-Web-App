# FRUS Explorer Light CI, on every pull request and on main.
# - swift: build and test in swift:6.4-noble with libsqlite3-dev, the way scripts/swift runs them.
# - compose: build the image, then scripts/compose-smoke imports a synthetic export with
#   docker compose cp and waits for /readyz to answer 200.
# Session 9 adds the web app.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every run on main completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  swift:
    name: swift
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 30
    steps:
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-dev

      # The submodule is public, and checked out whole: a SourceNoteKit test reads an app resource.
      - uses: actions/checkout@v5
        with:
          submodules: true

      # The dependencies (Hummingbird, SwiftNIO and about 20 more) dominate a clean build.
      - name: Cache the SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build/linux
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: swift build --build-tests --scratch-path .build/linux

      # Every test at the pin must run, and a skip fails the job. SPEC's check 1 allows a Linux-only
      # skip only if it is named, and there is one, allowed here by its name: FTS5StoreTests'
      # backup-exclusion test, which upstream disables where Darwin is missing, with a reason that
      # begins "Linux: ". Any other skip, or this one with another reason, still fails.
      - name: Test
        run: |
          swift test --skip-build --scratch-path .build/linux 2>&1 | tee test.log
          named='Test "Database file has isExcludedFromBackupKey set after creation" skipped: "Linux: '
          if grep -E '(Test|Suite) .* skipped' test.log | grep -vF -e "$named"; then
            echo "::error::A test was skipped. Every test at the pin must run, except the Linux-only skip SPEC's check 1 names."
            exit 1
          fi
          echo "Named Linux-only skips (SPEC, check 1): $(grep -cF -e "$named" test.log)"

      - name: Test count per target
        run: swift test list --skip-build --scratch-path .build/linux | cut -d. -f1 | sort | uniq -c

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: frus-light:ci
          load: true
          # Shared with image.yml's amd64 build.
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max,ignore-error=true

      - name: Install sqlite3 for the synthetic export
        run: command -v sqlite3 || (sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3)

      - name: Compose smoke test
        run: FRUS_IMAGE=frus-light:ci scripts/compose-smoke
