# FRUS Explorer Light, phase 1: one user on this machine, serving a FRUS Explorer research export.
#
#   docker compose up -d
#   docker compose cp <export file> frus:/data/import/
#   curl http://localhost:8080/readyz          # 503 naming the step until the index is open, then 200
#
# docs/INSTALL.md is the full guide. Everything the server keeps lives in the named volume
# frus-data. A folder of TEI volumes is mounted read-only, ./tei beside this file by default; the
# reader renders documents from it. On a Mac, FRUS Explorer's own folder works once Docker Desktop
# may read other apps' data (macOS refuses it until then); anywhere, a clone of HistoryAtState/frus
# works, with the same TEI XML in its volumes/ folder but not the app's figure images. The daily
# backup of your research data is also copied to a folder on this machine, ./backups beside this
# file by default, which outlives the volume and which this machine's own backup sees.
# Optional settings, from the environment or a .env file beside this one:
#   FRUS_TEI_DIR     folder of TEI volumes, ./tei by default
#   FRUS_BACKUP_DIR  folder that gets a copy of each daily backup, ./backups by default; on Linux,
#                    make it writable by UID 10001 first: sudo chown 10001:10001 backups
#   FRUS_BACKUP_HOUR hour of the daily backup, 0 to 23, 3 by default
#   TZ               time zone of that hour, such as America/New_York, UTC by default
#   FRUS_HOST_PORT   port on this machine's 127.0.0.1, 8080 by default
#   FRUS_PUBLIC_URL  the address people open, http://localhost:<port> by default; behind a reverse
#                    proxy, its address, which may end in a path such as /frus-explorer/. A change to
#                    your tags must come from a page at this address
#   FRUS_USER_DATA   off for a read-only server, which keeps no tags or other research data
#   FRUS_IMAGE       image to run, ghcr.io/joshbotts/frus-explorer-light:edge by default
#   COMPOSE_PROFILES set to pdf to start Gotenberg, for PDF export when it arrives (phase 3)

services:
  frus:
    image: ${FRUS_IMAGE:-ghcr.io/joshbotts/frus-explorer-light:edge}
    ports:
      - "127.0.0.1:${FRUS_HOST_PORT:-8080}:8080"
    volumes:
      - frus-data:/data
      - "${FRUS_TEI_DIR:-./tei}:/data/volumes:ro"
      - "${FRUS_BACKUP_DIR:-./backups}:/backups"
    environment:
      FRUS_MODE: import
      FRUS_AUTH: none
      FRUS_PUBLIC_URL: ${FRUS_PUBLIC_URL:-http://localhost:${FRUS_HOST_PORT:-8080}}
      FRUS_USER_DATA: ${FRUS_USER_DATA:-on}
      FRUS_BACKUP_COPY_DIR: /backups  # the backups folder above
      FRUS_BACKUP_HOUR: ${FRUS_BACKUP_HOUR:-3}
      TZ: ${TZ:-UTC}
      FRUS_PDF_URL: http://pdf:3000   # the optional pdf service below
    read_only: true          # the server writes only to /data, /backups and /tmp
    tmpfs:
      - /tmp
    cap_drop: [ALL]          # it binds port 8080 and needs no Linux capabilities
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  pdf:                       # optional, and off unless COMPOSE_PROFILES=pdf: a 700 MB download
    image: gotenberg/gotenberg:8
    profiles: [pdf]
    restart: unless-stopped

volumes:
  frus-data: {}
